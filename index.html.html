<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Vegetable Oil Filling Line</title>

  <!-- A-Frame 1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #hud {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(94vw, 760px);
      pointer-events: none;
    }

    .panel {
      background: rgba(5, 20, 30, 0.78);
      border: 1px solid rgba(80, 220, 255, 0.7);
      border-radius: 14px;
      padding: 10px 14px;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      backdrop-filter: blur(4px);
    }

    .title {
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 700;
      text-align: center;
      margin-bottom: 7px;
      letter-spacing: .2px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      font-size: clamp(11px, 2.8vw, 14px);
    }

    .item {
      background: rgba(255,255,255,.08);
      padding: 7px 8px;
      border-radius: 9px;
      text-align: center;
    }

    .label {
      opacity: .72;
      font-size: .82em;
      display: block;
      margin-bottom: 2px;
    }

    .value {
      font-weight: 700;
    }

    #hint {
      margin-top: 7px;
      text-align: center;
      font-size: clamp(11px, 2.7vw, 13px);
      color: #d9f7ff;
    }

    #markerMessage {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.72);
      color: white;
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
    }

    .ok { color: #7CFF9D; }
    .warn { color: #FFD966; }
  </style>
</head>

<body>
  <div id="hud">
    <div class="panel">
      <div class="title">AR Vegetable Oil Filling Line — Side View</div>
      <div class="row">
        <div class="item">
          <span class="label">STATUS</span>
          <span id="statusValue" class="value">WAITING</span>
        </div>
        <div class="item">
          <span class="label">STATION</span>
          <span id="stationValue" class="value">-</span>
        </div>
        <div class="item">
          <span class="label">BOTTLES</span>
          <span id="counterValue" class="value">0000</span>
        </div>
      </div>
      <div id="hint">ขวดเปล่า → เติมน้ำมัน → ปิดฝา → ออกจากไลน์</div>
    </div>
  </div>

  <div id="markerMessage">กรุณาส่องกล้องให้เห็น Hiro Marker</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; precision: mediump"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
  >

    <!--
      smooth / smoothCount / smoothTolerance / smoothThreshold
      ช่วยลดอาการสั่นจากการติดตาม Hiro Marker
    -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smoothCount="20"
      smoothTolerance="0.005"
      smoothThreshold="2"
    >

      <!-- MAIN MODEL -->
      <a-entity id="lineRoot" position="0 0 0" scale="0.85 0.85 0.85">

        <!-- FLOOR / BASE -->
        <a-box position="0 0.04 0"
               width="5.9" height="0.08" depth="1.45"
               color="#D9DEE4" roughness="0.95"></a-box>

        <!-- CONVEYOR SUPPORT -->
        <a-box position="0 0.26 0"
               width="5.65" height="0.32" depth="0.95"
               color="#2F363D" roughness="0.75"></a-box>

        <!-- CONVEYOR BELT -->
        <a-box position="0 0.45 0"
               width="5.5" height="0.08" depth="0.82"
               color="#171B20" roughness="0.7"></a-box>

        <!-- SIDE RAILS -->
        <a-box position="0 0.59 -0.42"
               width="5.5" height="0.05" depth="0.05"
               color="#AAB3BB" metalness="0.7"></a-box>
        <a-box position="0 0.59 0.42"
               width="5.5" height="0.05" depth="0.05"
               color="#AAB3BB" metalness="0.7"></a-box>

        <!-- SIMPLE LEGS -->
        <a-box position="-2.35 -0.02 -0.33" width="0.12" height="0.48" depth="0.12" color="#555B61"></a-box>
        <a-box position="-0.8 -0.02 -0.33" width="0.12" height="0.48" depth="0.12" color="#555B61"></a-box>
        <a-box position="0.8 -0.02 -0.33" width="0.12" height="0.48" depth="0.12" color="#555B61"></a-box>
        <a-box position="2.35 -0.02 -0.33" width="0.12" height="0.48" depth="0.12" color="#555B61"></a-box>

        <!-- DIRECTION ARROWS -->
        <a-triangle position="-2.15 0.74 -0.47" rotation="0 0 -90" vertex-a="0 0.12 0" vertex-b="-0.18 -0.10 0" vertex-c="0.18 -0.10 0" color="#31E58A"></a-triangle>
        <a-triangle position="2.12 0.74 -0.47" rotation="0 0 -90" vertex-a="0 0.12 0" vertex-b="-0.18 -0.10 0" vertex-c="0.18 -0.10 0" color="#31E58A"></a-triangle>

        <!-- STATION 1: FILLING FRAME -->
        <a-entity id="fillingStation" position="-0.75 0 0">
          <a-box position="-0.42 1.18 0" width="0.10" height="1.55" depth="0.76" color="#D8DEE3" metalness="0.6"></a-box>
          <a-box position="0.42 1.18 0" width="0.10" height="1.55" depth="0.76" color="#D8DEE3" metalness="0.6"></a-box>
          <a-box position="0 1.92 0" width="0.94" height="0.12" depth="0.76" color="#D8DEE3" metalness="0.6"></a-box>

          <a-box position="0 2.18 0" width="1.15" height="0.38" depth="0.76" color="#F5B82E"></a-box>
          <a-text value="STATION 1\nFILLING"
                  align="center"
                  color="#111111"
                  width="2.2"
                  position="0 2.19 0.39"
                  rotation="0 0 0"></a-text>

          <a-cylinder id="fillNozzle"
                      position="0 1.70 0"
                      radius="0.055"
                      height="0.42"
                      color="#C6CDD3"
                      metalness="0.8"></a-cylinder>

          <a-cylinder id="fillTip"
                      position="0 1.45 0"
                      radius="0.025"
                      height="0.22"
                      color="#777F86"
                      metalness="0.7"></a-cylinder>

          <a-cylinder id="oilStream"
                      position="0 1.18 0"
                      radius="0.025"
                      height="0.30"
                      color="#F6C22D"
                      opacity="0"
                      transparent="true"></a-cylinder>

          <a-sphere position="0.38 1.70 0.41" radius="0.07" color="#24E36B"></a-sphere>
        </a-entity>

        <!-- STATION 2: CAPPING FRAME -->
        <a-entity id="cappingStation" position="1.08 0 0">
          <a-box position="-0.42 1.18 0" width="0.10" height="1.55" depth="0.76" color="#D8DEE3" metalness="0.6"></a-box>
          <a-box position="0.42 1.18 0" width="0.10" height="1.55" depth="0.76" color="#D8DEE3" metalness="0.6"></a-box>
          <a-box position="0 1.92 0" width="0.94" height="0.12" depth="0.76" color="#D8DEE3" metalness="0.6"></a-box>

          <a-box position="0 2.18 0" width="1.15" height="0.38" depth="0.76" color="#1778D4"></a-box>
          <a-text value="STATION 2\nCAPPING"
                  align="center"
                  color="#FFFFFF"
                  width="2.2"
                  position="0 2.19 0.39"></a-text>

          <a-cylinder id="capHead"
                      position="0 1.68 0"
                      radius="0.14"
                      height="0.28"
                      color="#32383D"
                      metalness="0.75"></a-cylinder>

          <a-cylinder id="workingCap"
                      position="0 1.48 0"
                      radius="0.10"
                      height="0.07"
                      color="#FFD52A"
                      visible="false"></a-cylinder>

          <a-sphere position="0.38 1.70 0.41" radius="0.07" color="#24E36B"></a-sphere>
        </a-entity>

        <!-- ENTRY / EXIT SIGNS -->
        <a-box position="-2.45 1.55 0" width="0.78" height="0.48" depth="0.06" color="#30363D"></a-box>
        <a-text value="EMPTY\nBOTTLE"
                align="center"
                color="#FFFFFF"
                width="1.65"
                position="-2.45 1.55 0.04"></a-text>

        <a-box position="2.42 1.55 0" width="0.78" height="0.48" depth="0.06" color="#30363D"></a-box>
        <a-text value="OUTFEED"
                align="center"
                color="#FFFFFF"
                width="1.65"
                position="2.42 1.55 0.04"></a-text>

        <!-- MOVING BOTTLE -->
        <a-entity id="bottle" position="-2.45 0.93 0">

          <!-- Clear PET body -->
          <a-cylinder id="bottleBody"
                      position="0 0 0"
                      radius="0.20"
                      height="0.72"
                      color="#DFF7FF"
                      opacity="0.38"
                      transparent="true"
                      roughness="0.15"></a-cylinder>

          <!-- Shoulder -->
          <a-cone position="0 0.40 0"
                  radius-bottom="0.20"
                  radius-top="0.11"
                  height="0.18"
                  color="#DFF7FF"
                  opacity="0.38"
                  transparent="true"></a-cone>

          <!-- Neck -->
          <a-cylinder position="0 0.54 0"
                      radius="0.105"
                      height="0.16"
                      color="#DFF7FF"
                      opacity="0.40"
                      transparent="true"></a-cylinder>

          <!-- Oil inside bottle -->
          <a-cylinder id="oil"
                      position="0 -0.34 0"
                      radius="0.165"
                      height="0.01"
                      color="#F5C329"
                      opacity="0.90"
                      transparent="true"></a-cylinder>

          <!-- Bottle cap (hidden until Station 2 completed) -->
          <a-cylinder id="bottleCap"
                      position="0 0.66 0"
                      radius="0.11"
                      height="0.075"
                      color="#FFD52A"
                      visible="false"></a-cylinder>

          <!-- Small bottle base -->
          <a-cylinder position="0 -0.37 0"
                      radius="0.19"
                      height="0.05"
                      color="#CBEFFF"
                      opacity="0.45"
                      transparent="true"></a-cylinder>
        </a-entity>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    (() => {
      const marker = document.querySelector('#hiroMarker');
      const bottle = document.querySelector('#bottle');
      const oil = document.querySelector('#oil');
      const bottleCap = document.querySelector('#bottleCap');
      const fillNozzle = document.querySelector('#fillNozzle');
      const fillTip = document.querySelector('#fillTip');
      const oilStream = document.querySelector('#oilStream');
      const capHead = document.querySelector('#capHead');
      const workingCap = document.querySelector('#workingCap');

      const statusValue = document.querySelector('#statusValue');
      const stationValue = document.querySelector('#stationValue');
      const counterValue = document.querySelector('#counterValue');
      const markerMessage = document.querySelector('#markerMessage');

      // Positions on X axis
      const X_START = -2.45;
      const X_FILL  = -0.75;
      const X_CAP   =  1.08;
      const X_EXIT  =  2.55;

      // Timing in milliseconds
      const MOVE_TO_FILL = 2200;  // ขวดเคลื่อนที่เข้า Station 1
      const FILL_TIME    = 2600;  // เติมน้ำมัน
      const MOVE_TO_CAP  = 2200;  // ไป Station 2
      const CAP_TIME     = 1900;  // ปิดฝา
      const MOVE_TO_EXIT = 2100;  // ออกจากไลน์
      const RESET_DELAY  = 900;

      let running = false;
      let markerVisible = false;
      let counter = 0;
      let rafId = null;
      let token = 0;

      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      function clamp01(v) {
        return Math.max(0, Math.min(1, v));
      }

      function easeInOutCubic(t) {
        t = clamp01(t);
        return t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function setX(x) {
        const p = bottle.getAttribute('position');
        bottle.setAttribute('position', { x, y: p.y, z: p.z });
      }

      function getX() {
        return bottle.getAttribute('position').x;
      }

      function setStatus(text, station='-') {
        statusValue.textContent = text;
        stationValue.textContent = station;
      }

      function formatCounter(v) {
        return String(v).padStart(4, '0');
      }

      function animate(duration, update, expectedToken) {
        return new Promise(resolve => {
          const start = performance.now();

          function frame(now) {
            if (expectedToken !== token || !running || !markerVisible) {
              resolve(false);
              return;
            }

            const t = clamp01((now - start) / duration);
            update(easeInOutCubic(t), t);

            if (t < 1) {
              rafId = requestAnimationFrame(frame);
            } else {
              resolve(true);
            }
          }

          rafId = requestAnimationFrame(frame);
        });
      }

      async function moveBottle(fromX, toX, duration, expectedToken) {
        return animate(duration, (eased) => {
          const x = fromX + (toX - fromX) * eased;
          setX(x);
        }, expectedToken);
      }

      async function fillingProcess(expectedToken) {
        setStatus('FILLING', '1');

        // nozzle down
        const nozzleStartY = 1.70;
        const tipStartY = 1.45;
        const nozzleDrop = 0.28;

        let ok = await animate(500, (eased) => {
          fillNozzle.setAttribute('position', `0 ${nozzleStartY - nozzleDrop * eased} 0`);
          fillTip.setAttribute('position', `0 ${tipStartY - nozzleDrop * eased} 0`);
        }, expectedToken);
        if (!ok) return false;

        oilStream.setAttribute('opacity', 0.9);

        // Fill oil smoothly from almost empty to full
        ok = await animate(FILL_TIME, (eased) => {
          const maxH = 0.58;
          const h = 0.02 + (maxH - 0.02) * eased;
          const baseBottomY = -0.35;
          const centerY = baseBottomY + h / 2;

          oil.setAttribute('geometry', `primitive: cylinder; radius: 0.165; height: ${h}`);
          oil.setAttribute('position', `0 ${centerY} 0`);
        }, expectedToken);
        if (!ok) return false;

        oilStream.setAttribute('opacity', 0);

        // nozzle up
        ok = await animate(500, (eased) => {
          fillNozzle.setAttribute('position', `0 ${nozzleStartY - nozzleDrop * (1 - eased)} 0`);
          fillTip.setAttribute('position', `0 ${tipStartY - nozzleDrop * (1 - eased)} 0`);
        }, expectedToken);

        return ok;
      }

      async function cappingProcess(expectedToken) {
        setStatus('CAPPING', '2');

        const headStartY = 1.68;
        const headDrop = 0.34;

        workingCap.setAttribute('visible', true);

        // Head + cap down
        let ok = await animate(520, (eased) => {
          capHead.setAttribute('position', `0 ${headStartY - headDrop * eased} 0`);
          workingCap.setAttribute('position', `0 ${1.48 - headDrop * eased} 0`);
        }, expectedToken);
        if (!ok) return false;

        // Rotate cap while pressing
        ok = await animate(760, (eased) => {
          workingCap.setAttribute('rotation', `0 ${eased * 540} 0`);
          capHead.setAttribute('rotation', `0 ${eased * 220} 0`);
        }, expectedToken);
        if (!ok) return false;

        workingCap.setAttribute('visible', false);
        bottleCap.setAttribute('visible', true);

        // Head up
        ok = await animate(520, (eased) => {
          capHead.setAttribute('position', `0 ${headStartY - headDrop * (1 - eased)} 0`);
        }, expectedToken);

        return ok;
      }

      function resetBottle() {
        setX(X_START);

        oil.setAttribute('geometry', 'primitive: cylinder; radius: 0.165; height: 0.01');
        oil.setAttribute('position', '0 -0.345 0');

        bottleCap.setAttribute('visible', false);
        workingCap.setAttribute('visible', false);

        fillNozzle.setAttribute('position', '0 1.70 0');
        fillTip.setAttribute('position', '0 1.45 0');
        oilStream.setAttribute('opacity', 0);

        capHead.setAttribute('position', '0 1.68 0');
        capHead.setAttribute('rotation', '0 0 0');
        workingCap.setAttribute('position', '0 1.48 0');
        workingCap.setAttribute('rotation', '0 0 0');
      }

      async function runCycle(expectedToken) {
        while (running && markerVisible && expectedToken === token) {
          resetBottle();

          setStatus('INFEED', '-');
          if (!await moveBottle(X_START, X_FILL, MOVE_TO_FILL, expectedToken)) break;

          if (!await fillingProcess(expectedToken)) break;

          setStatus('TRANSFER', '1 → 2');
          if (!await moveBottle(X_FILL, X_CAP, MOVE_TO_CAP, expectedToken)) break;

          if (!await cappingProcess(expectedToken)) break;

          setStatus('OUTFEED', '-');
          if (!await moveBottle(X_CAP, X_EXIT, MOVE_TO_EXIT, expectedToken)) break;

          counter += 1;
          counterValue.textContent = formatCounter(counter);
          setStatus('COMPLETE', '-');

          await sleep(RESET_DELAY);

          if (!running || !markerVisible || expectedToken !== token) break;
        }
      }

      function startLine() {
        if (running) return;
        running = true;
        token += 1;
        setStatus('RUNNING', '-');
        runCycle(token);
      }

      function stopLine() {
        running = false;
        token += 1;
        if (rafId) cancelAnimationFrame(rafId);
        setStatus('PAUSED', '-');
      }

      marker.addEventListener('markerFound', () => {
        markerVisible = true;
        markerMessage.textContent = 'Hiro Marker detected — Line running';
        markerMessage.classList.add('ok');
        markerMessage.classList.remove('warn');
        startLine();
      });

      marker.addEventListener('markerLost', () => {
        markerVisible = false;
        markerMessage.textContent = 'Marker lost — กรุณาส่องกล้องให้เห็น Hiro Marker';
        markerMessage.classList.remove('ok');
        markerMessage.classList.add('warn');
        stopLine();
      });

      // Initial state
      resetBottle();
      counterValue.textContent = formatCounter(counter);
    })();
  </script>
</body>
</html>
